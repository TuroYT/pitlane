# New advisories appear without any change to the code: scan main every week,
# with the same checks as the pull request jobs (see docs/ci.md). A failed run
# is reported by e-mail to whoever enabled notifications for failed workflows.
name: Vulnerabilities
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Same runner choice as ci.yml: the repository variable PITLANE_RUNNER, else
# GitHub-hosted. These runs never come from a fork.
jobs:
  scan:
    name: Go and web dependencies
    runs-on: ${{ vars.PITLANE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: true
          go-cache: vuln
          node-package: web
      - name: govulncheck and pnpm audit
        run: make vuln
