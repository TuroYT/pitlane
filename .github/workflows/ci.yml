name: ci
on:
  push:
    branches: [main]
  pull_request:

# Set the repository variable PITLANE_RUNNER (e.g. "pitlane") to dogfood
# Pitlane; otherwise GitHub-hosted runners are used. Pull requests from forks
# always run on GitHub-hosted runners: every Pitlane job controls a privileged
# Docker daemon (see docs/security.md). A fork can still edit this file in its
# pull request, so keep "Require approval for all external contributors" on.
jobs:
  test:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.PITLANE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Pitlane keeps Go caches on local disk; uploading them is wasted time.
          cache: ${{ !vars.PITLANE_RUNNER }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: make web
      - name: web tests
        run: pnpm test
        working-directory: web
      - name: web lint
        run: pnpm lint
        working-directory: web
      - run: test -z "$(gofmt -l ./cmd ./internal ./web)"
      - run: go vet ./...
      - name: go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: golangci-lint
        # Built with the job's Go toolchain (go run), so it always
        # supports the Go version go.mod targets. Pinned: bump on purpose.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - run: go test -race ./...
      - run: make build
