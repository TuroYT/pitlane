name: Feature request
description: Suggest something Pitlane should do, or do differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open questions or early ideas, [Discussions](https://github.com/TuroYT/pitlane/discussions) may be a better place to start.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today. A concrete workflow or setup helps a lot.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you picture it working, as a UI change, a flag, a setting or an API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds and alternatives
      description: What you do now instead, and other approaches you thought about.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
