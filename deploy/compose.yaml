# Pitlane with Docker Compose.
#   1. Set PITLANE_BASE_URL to the address you will open in your browser.
#   2. docker compose up -d
#   3. Open that address and follow the setup (token: docker compose exec pitlane /pitlane setup-token;
#      if the data directory is not writable, it is in docker compose logs pitlane)
services:
  pitlane:
    image: ghcr.io/turoyt/pitlane:v1.3.0@sha256:a61b6a6f60383fa9e2ab04fc8ead59082bd26b3fe6ffaaa4c3fbe2b418e549eb
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PITLANE_BASE_URL: ${PITLANE_BASE_URL:-http://localhost:8080}
    volumes:
      - pitlane-data:/data
      # Pitlane drives Docker to start its slots and runners. Jobs never get
      # this socket: each slot has its own isolated Docker-in-Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pitlane-data:
