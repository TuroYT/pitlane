# Pitlane e2e (g): a matrix of 4 jobs that must run at the same time, each on
# its own fresh runner. Every leg records when it started and stopped; the
# last job computes how many legs overlapped.
name: e2e-matrix
on:
  workflow_dispatch:
    inputs:
      label:
        description: runs-on label of the Pitlane instance under test
        default: pitlane
      min-concurrency:
        description: fail if fewer legs than this ran at the same time
        default: "4"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  leg:
    runs-on: ${{ inputs.label || 'pitlane' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]
    steps:
      - name: hold the runner for a while
        run: |
          set -eu
          start=$(date +%s.%N)
          echo "leg ${{ matrix.leg }} on $RUNNER_NAME (slot ${PITLANE_SLOT:-?}) at $(date -u +%T.%N)"
          sleep 30
          end=$(date +%s.%N)
          mkdir -p t
          echo "${{ matrix.leg }} $start $end $RUNNER_NAME" > "t/leg-${{ matrix.leg }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-leg-${{ matrix.leg }}-${{ github.run_attempt }}
          path: t/
          retention-days: 1

  concurrency:
    needs: leg
    runs-on: ${{ inputs.label || 'pitlane' }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-leg-*-${{ github.run_attempt }}
          path: t
          merge-multiple: true

      - name: legs overlapped on distinct runners
        env:
          MIN: ${{ inputs.min-concurrency || '4' }}
        run: |
          set -eu
          cat t/*.txt | sort -n
          test "$(cat t/*.txt | wc -l)" = 4
          # Each runner is ephemeral: no runner name may appear twice.
          test "$(cat t/*.txt | awk '{print $4}' | sort -u | wc -l)" = 4
          # Peak number of legs running at the same instant.
          peak=$(cat t/*.txt | awk '{print $2, 1; print $3, -1}' | sort -k1,1g -k2,2n \
                 | awk '{c += $2; if (c > m) m = c} END {print m}')
          spread=$(cat t/*.txt | awk 'NR==1{min=$2;max=$2} {if($2<min)min=$2; if($2>max)max=$2} END {printf "%.1f", max-min}')
          echo "peak concurrency: $peak of 4, start spread: ${spread}s"
          echo "::notice title=e2e-timing::matrix peak concurrency ${peak}/4, start spread ${spread}s"
          test "$peak" -ge "$MIN"
